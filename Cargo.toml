[package]
name = "bookserver_backend"
version = "0.1.3"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
futures = "0.3.34"
tracing = "0.1"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
walkdir = "2"
# Compiled in: Windows has no system SQLite, and every platform runs the same version.
rusqlite = { version = "0.40.2", features = ["bundled"] }
r2d2_sqlite = "0.35.0"
r2d2 = "0.8.10"
regex = "1.13.1"
blake3 = "1.8.7"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
base64 = "0.23.1"
toml = "1.1.5"
argon2 = "0.6.0"
rand = "0.10.2"
hex = "0.4"
mail-send = "0.6.2"
once_cell = "1.21.4"
anyhow = "1.0.104"
thiserror = "2.0.20"
natord = "1.0.9"
# The PDFium binary must be this API build or newer; with `pdfium_latest`, a crate update can
# demand functions an installed binary lacks, which panics only when a PDF is scanned.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7543", "image_latest", "thread_safe"] }
image = "0.25.10"
# Only the formats a page can be (`page_media_type`), so no other parser runs on a book's files.
imagesize = { version = "0.15.0", default-features = false, features = ["jpeg", "png", "webp"] }
zip = "8.6.0"
quick-xml = "0.41.0"
percent-encoding = "2.3.2"
tower-http = {version = "0.7.1", features = ["full"]}
tower = "0.5.3"
uuid = {version="1.26.0", features=["v4",]}
chrono = {version="0.4.45", features=["serde"]}
directories = "6.0.0"
totp-rs = { version = "6.0.0", features = ["otpauth"] }
notify = { version = "9.0.0", features = ["tokio"] }

# Unoptimised Argon2 takes seconds per hash, and the tests hash a lot.
[profile.dev.package.argon2]
opt-level = 3

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }

