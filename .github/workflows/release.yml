name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUST_VERSION: 1.96.1
  CARGO_ABOUT_VERSION: 0.9.3
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Git on Windows checks files out with CRLF line endings, which break bash scripts.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - run: cargo test --locked

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - platform: windows-x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          # The oldest runner: a Linux binary needs a glibc at least as new as the one it was built with.
          - platform: linux-x64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      PLATFORM: ${{ matrix.platform }}
      TARGETS: ${{ matrix.targets }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add $TARGETS
      - run: cargo install cargo-about --locked --features cli --version "$CARGO_ABOUT_VERSION"
      - run: scripts/package.sh "$PLATFORM"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}
          path: |
            target/dist/*.zip
            target/dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The tag matches Cargo.toml's version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --draft --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
